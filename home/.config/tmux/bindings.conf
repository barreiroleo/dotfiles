# Changing prefix from 'Ctrl+b' to 'Alt+a'.
# Alt=Meta: Has the same code as Escape. Is a trouble with vim, quit escape-time solve it.
set-option -g prefix M-a

# Remove defaults: prefix, split horizontal, split vertical
unbind-key C-b; unbind-key '"'; unbind-key %
bind-key M-a send-prefix

# History and copy mode
bind-key -n C-l              send-keys C-l \; send-keys -R \; clear-history
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection-no-clear
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Moving between panes.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Resize panes.
bind-key -r H resize-pane -L 1
bind-key -r J resize-pane -D 1
bind-key -r K resize-pane -U 1
bind-key -r L resize-pane -R 1

# Split windows or panes
bind-key "\\" split-window -h -c "#{pane_current_path}"
bind-key "/"  split-window -h -c "#{pane_current_path}"
bind-key "-"  split-window -v -c "#{pane_current_path}"
bind-key c    new-window      -c "#{pane_current_path}"

bind-key -n M-g if-shell -F '#{==:#{session_name},scratch}' { detach-client } {
  display-popup -d "#{pane_current_path}" -w 80% -h 80% -E "tmux new-session -A -s scratch"
}

bind-key d display-menu -T "#[align=centre]Quick Actions" -x C -y C \
     "Edit zshrc"         z  'new-window -c "~/dotfiles/home/" "nvim .zshrc"' \
     "Edit zshenv"        -  'new-window -c "~/dotfiles/home/" "nvim .zshenv"' \
     "Edit tmux config"   t  'new-window -c "~/.config/tmux/" "nvim tmux.conf"' \
     "Edit nvim config"   v  'new-window -c "~/.config/nvim/" "nvim init.lua"' \
     "Explore dotfiles"   d  'new-window -c "~/dotfiles/" "${SHELL}"' \
     "cancel"             q  ""

bind-key m display-menu -T "#[align=centre]Join pane" -x C -y C \
    "Push current pane to window"          P 'choose-tree -Zw "join-pane -t %%"' \
    "Push current pane to session"         S 'choose-tree -Zs "join-pane -t %%"' \
    "Pull selected pane to current window" U 'choose-tree -Z "join-pane -s %%"' \
    "cancel"                               q ""

bind-key r source-file ~/.config/tmux/tmux.conf ';' display "Reloaded"

# Launch Todo file
# bind-key -r t new-window -c "#{pane_current_path}" "[[ -e todo.md ]] && nvim todo.md || nvim ~/todo.md"
